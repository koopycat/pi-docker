# Applied with --patch when rapunzel starts `dsh web`. Inside the container
# dsh must listen on all interfaces so Docker can forward the published port;
# the launcher publishes it on the host's 127.0.0.1 only. dsh's own launch
# token, session cookie, and Host check stay in force. A patch replaces the
# row's whole config, so this repeats the shipped keys and keeps the port
# expression so `--port` still applies.
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
